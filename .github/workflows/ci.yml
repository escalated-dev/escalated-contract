name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  contract:
    name: Validate the contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every fixture names a document in the context repo, and validate.py
      # confirms it exists. That repo is public, so this clones without a token
      # and is expected to succeed. If it ever fails, the run fails rather than
      # quietly dropping the check: a source check that skips itself is the
      # same failure escalated-locale had, where five publish jobs skipped for
      # months and the workflow stayed green.
      - name: Check out escalated-developer-context
        run: git clone --depth 1 https://github.com/escalated-dev/escalated-developer-context.git .context

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install pyyaml jsonschema

      - name: Validate schemas, cross-references and sources
        run: python scripts/validate.py --context .context

      # packages/*/contract is generated. If it has drifted from contract/,
      # a release would publish something different from what is in the repo.
      - name: Per-package copies are in sync
        run: python scripts/sync.py --check

  runners:
    name: Reference runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Node runner
        run: node --test runners/node/*.test.js

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Go package builds and embeds
        run: go vet ./...

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP accessor parses
        run: php -l packages/composer/src/Contract.php

      # Reads the manifest through the published accessor rather than the file,
      # so a broken embed or path shows up here and not in a port.
      - name: PHP accessor reads the manifest
        run: |
          php -r '
            require "packages/composer/src/Contract.php";
            $pages = Escalated\Contract\Contract::pages();
            if (count($pages) < 1) { fwrite(STDERR, "no pages\n"); exit(1); }
            printf("%d pages, frontend %s\n", count($pages), Escalated\Contract\Contract::frontendVersion());
          '
